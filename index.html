<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skevit Revogacao</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f141d;
      --panel: #1a2230;
      --border: #263244;
      --text: #f4f7fb;
      --muted: #a9b6c8;
      --green: #28cf5a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
      padding: 24px;
    }
    .panel {
      width: min(640px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.24);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .mark {
      width: 14px;
      height: 28px;
      border-radius: 6px;
      background: linear-gradient(180deg, #66e066 0%, var(--green) 100%);
    }
    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
    }
    .subtitle {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 15px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(40, 207, 90, 0.12);
      color: #8cf5ad;
      border: 1px solid rgba(40, 207, 90, 0.35);
      font-weight: 600;
      margin-bottom: 16px;
    }
    .status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--green);
    }
    .meta {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      word-break: break-word;
    }
    a {
      color: #8bc2ff;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    code {
      font-family: Consolas, monospace;
      color: #9cf5b3;
    }
  </style>
</head>
<body>
  <main class="panel">
    <div class="brand">
      <div class="mark"></div>
      <div>
        <h1>Skevit</h1>
        <p class="subtitle">Feed publico de revogacao de licencas</p>
      </div>
    </div>
    <div class="status">Arquivo de revogacao publicado</div>
    <p class="meta">Ultima atualizacao local: 05/05/2026 17:14:47 UTC</p>
    <p class="meta">Arquivo esperado pelo plugin: <code>skevit.revocations</code></p>
    
    
  </main>
</body>
</html>
